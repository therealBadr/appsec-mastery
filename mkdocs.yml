site_name: AppSec Mastery
site_description: An open, hands-on application security curriculum — 42 project-style subjects, written in public by a learner.
site_url: https://YOUR_GITHUB_USERNAME.github.io/appsec-mastery/
repo_url: https://github.com/YOUR_GITHUB_USERNAME/appsec-mastery
repo_name: YOUR_GITHUB_USERNAME/appsec-mastery
edit_uri: edit/main/docs/
copyright: Content CC BY-SA 4.0 · Code MIT

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

# Files and folders starting with "_" are drafts: they stay in the repo but are not published.
exclude_docs: |
  _*
  .*

